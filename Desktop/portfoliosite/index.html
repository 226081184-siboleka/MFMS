<!DOCTYPE html>

            }
            .button-container {
                display: flex;

                align-items: center;
            }
            .button {
                background-color: #ede6d9;
                color: #342519;
                border-color:#342519;
                display: inline-block;

                border: 2px solid #342519;
                border-radius: 20px;
                padding: 10px 20px;
                width: min(80%, 200px);
            }
            .button:hover {
                background-color: #342519;
                color: #ede6d9;
                transform: scale(1.05);
            }
            ::selection {
                background-color: #342519;
                color: #ede6d9;
            }

                scrollbar-color: #342519 #ede6d9;
